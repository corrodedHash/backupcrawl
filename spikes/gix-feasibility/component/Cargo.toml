[package]
name = "gix-feasibility"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
# The crate is a wasm component; its bindings are generated by cargo-component.
# It is never built or tested for the host, so keep `cargo test` in this
# workspace focused on the native runner.
test = false
doctest = false

[dependencies]
# gix 0.89: no `mmap`/`parallel`/`interrupt`/`command`/`credentials` features,
# and `default-features = false` drops `max-performance-safe` (which enables
# `parallel` and pack caches). `status` pulls `dirwalk` -> `attributes` ->
# `excludes`, which is everything needed for porcelain-v2-like status. `basic`
# pulls `revision` (needed for `merge_base`) and `index`. `sha1` is required to
# hash racily-clean worktree files while comparing them to the index.
# gix 0.89 always uses zlib-rs through gix-zlib, so no zlib feature selection
# is needed anymore.
gix = { version = "0.89.0", default-features = false, features = ["basic", "status", "sha1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[package.metadata.component]
package = "backupcrawl:spike"
