[package]
name = "gix-feasibility-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native wasmtime runner and fixture tests for the M1.7 gix component"

[dependencies]
anyhow = "1"
wasmtime = { version = "49.0.0", default-features = false, features = [
    "anyhow",
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
wasmtime-wasi = "49.0.0"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[bin]]
name = "gix-spike-run"
path = "src/main.rs"
