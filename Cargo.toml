[workspace]
resolver = "3"
members = [
    "crates/backupcrawl-core",
    "crates/backupcrawl-cli",
    "crates/backupcrawl-wit",
    "crates/backupcrawl-host",
    "crates/backupcrawl-plugin-sdk",
    "crates/backupcrawl-plugin-sdk/example-plugin",
    "crates/test-components",
    "plugins/git",
]
# The gix feasibility spike (M1.7) is a standalone workspace with its own lockfile
# and a wasm component crate; keep it out of the main workspace. `vendor/` holds
# the `[patch.crates-io]` shims used to build gix for wasm32-wasip2 (M1.8).
exclude = ["spikes", "vendor"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# 1.96 is the MSRV of wasmtime/wasmtime-wasi 49.
rust-version = "1.96"
authors = ["Lukas Wölfer"]
license = "MIT"
repository = "https://github.com/corrodedHash/backupcrawl"
description = "Detect files which are not backed up"

[workspace.dependencies]
anyhow = "1"
backupcrawl-core = { path = "crates/backupcrawl-core" }
clap = { version = "4", features = ["derive"] }
console = "0.15"
dirs = "6"
env_logger = "0.11"
# gix 0.89 without `mmap`/`parallel`/`interrupt`/`command`/`credentials`:
# `default-features = false` drops `max-performance-safe` (which enables
# `parallel` and pack caches). `status` pulls `dirwalk` -> `attributes` ->
# `excludes`; `basic` pulls `revision` (for `merge_base`) and `index`; `sha1`
# hashes racily-clean worktree files while comparing them to the index.
# gix uses `memmap2` and `filetime` unconditionally; both are patched below.
gix = { version = "0.89", default-features = false, features = ["basic", "status", "sha1"] }
globset = "0.4"
hex = "0.4"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "0.8"
toml_edit = "0.25"
url = "2"
wasmtime = "49.0"
wasmtime-wasi = "49.0"
# wit-bindgen is pinned to the version cargo-component 0.21.1 generates its
# bindings with (wit-bindgen-rust 0.41.0).
wit-bindgen = "0.41"
# wit-parser matches the generation used by wasmtime 49's `bindgen!`.
wit-parser = "0.258"

# gix 0.89 uses `memmap2` unconditionally (index, loose objects, packs, packed
# refs) and `memmap2` has no wasm implementation; `filetime`'s wasm reader
# accessors are `unimplemented!()`. Both are vendored shims (the M1.7 spike's
# reference implementations) so the git detector can run on wasm32-wasip2.
# See docs/rust-rewrite-plan.md §7.1 "M1.7 spike results".
[patch.crates-io]
memmap2 = { path = "vendor/memmap2-shim" }
filetime = { path = "vendor/filetime" }
