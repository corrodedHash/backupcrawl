name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain, components and wasm targets from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # Runs the whole suite and records wall/CPU/RSS/IO metrics per test binary
      # (see docs/test-metrics.md). The comparison against the committed
      # baseline is a local tool: GitHub runners differ from developer machines.
      - name: Test with resource metrics
        run: python3 scripts/test-stats.py --output test-stats.json --markdown test-stats.md
      - name: Upload test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stats
          path: |
            test-stats.json
            test-stats.md

  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # Pin the same cargo-component that produced the checked-in fixture;
      # fall back to building it from source when no prebuilt is available.
      - name: Install cargo-component (prebuilt)
        id: install-cargo-component
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component@0.21.1
      - name: Install cargo-component (from source)
        if: steps.install-cargo-component.outcome == 'failure'
        run: cargo install cargo-component --version 0.21.1 --locked
      - name: Rebuild fixture components and fail on stale artifacts
        run: |
          scripts/build-test-components.sh
          git diff --exit-code -- crates/backupcrawl-host/tests/fixtures
      # The SDK example is the authoring-path fixture: it must componentize
      # with the same cargo-component on every change.
      - name: Build the SDK example component
        run: scripts/build-example-plugin.sh
      # The bundled git plugin is embedded in the binary via `include_bytes!`;
      # fail if the committed component is stale (or not reproducible).
      - name: Rebuild the bundled git plugin and fail on a stale artifact
        run: |
          scripts/build-git-plugin.sh
          git diff --exit-code -- plugins/git/dist/git.wasm
      # Same for the bundled pacman plugin.
      - name: Rebuild the bundled pacman plugin and fail on a stale artifact
        run: |
          scripts/build-pacman-plugin.sh
          git diff --exit-code -- plugins/pacman/dist/pacman.wasm
